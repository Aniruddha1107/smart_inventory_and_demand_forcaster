spring.application.name=smartinventory

# Server
server.port=8083

# MySQL Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_inventory}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Python Forecasting API
forecast.api.url=http://localhost:8000/forecast

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# DevTools
# Disable auto-restart so editing files doesn't wipe the HTTP session
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
