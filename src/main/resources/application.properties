spring.application.name=smartinventory
# ─── Server ───────────────────────────────────────────
server.port=8083

# ─── MySQL Database ───────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/smart_inventory
spring.datasource.username=root
spring.datasource.password=magnur11
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ──────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ─── Thymeleaf ────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ─── Python Forecasting API (update ngrok URL daily) ──
forecast.api.url=http://localhost:8000/forecast

# ─── Logging ──────────────────────────────────────────
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

spring.security.user.name=admin
spring.security.user.password=admin

# ─── DevTools ─────────────────────────────────────────
# Disable auto-restart so editing files doesn't wipe the HTTP session
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false