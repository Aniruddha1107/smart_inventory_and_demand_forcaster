<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Dashboard')}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>

<body>
    <nav th:replace="~{fragments/layout :: navbar}"></nav>
    <main class="container">
        <h1>Dashboard</h1>
        <div class="stats-grid">
            <div class="card">
                <h3 class="text-muted">Total Products</h3>
                <p class="stat-value" th:text="${totalProducts}">0</p>
            </div>
            <div class="card">
                <h3 class="text-muted">Low Stock Items</h3>
                <p class="stat-value text-danger" th:text="${lowStockProducts.size()}">0</p>
            </div>
            <div class="card">
                <h3 class="text-muted">Active Alerts</h3>
                <p class="stat-value text-danger" th:text="${activeAlerts.size()}">0</p>
            </div>
            <div class="card">
                <h3 class="text-muted">Total Sales</h3>
                <p class="stat-value" th:text="${sales.size()}">0</p>
            </div>
        </div>

        <div class="card" style="margin:2rem 0;">
            <h3>Sales Trend (Sample)</h3>
            <canvas id="salesChart" height="100"></canvas>
        </div>

        <!-- Recent Inventory Activity -->
        <div class="card" style="margin-bottom:2rem;" th:if="${!#lists.isEmpty(recentLogs)}">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h3>Recent Inventory Activity</h3>
                <a th:href="@{/inventory-log}" style="color:var(--primary); font-size:0.9rem;">View All →</a>
            </div>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Product</th>
                        <th>Type</th>
                        <th>Qty Change</th>
                        <th>By</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${recentLogs}">
                        <td th:text="${#temporals.format(log.timestamp, 'dd MMM HH:mm')}"
                            style="color:var(--text-muted); font-size:0.85rem;"></td>
                        <td th:text="${log.product.name}"></td>
                        <td>
                            <span th:if="${log.changeType.name() == 'SALE'}" class="badge badge-lost">SALE</span>
                            <span th:if="${log.changeType.name() == 'RESTOCK'}"
                                class="badge badge-champions">RESTOCK</span>
                            <span th:if="${log.changeType.name() == 'ADJUSTMENT'}"
                                class="badge badge-at-risk">ADJUST</span>
                        </td>
                        <td>
                            <span th:if="${log.qtyChange > 0}" th:text="'+' + ${log.qtyChange}"
                                style="color:var(--success); font-weight:600;"></span>
                            <span th:if="${log.qtyChange <= 0}" th:text="${log.qtyChange}"
                                style="color:var(--danger); font-weight:600;"></span>
                        </td>
                        <td th:text="${log.user != null ? log.user.username : '—'}" style="color:var(--text-muted);">
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <script>
        const ctx = document.getElementById('salesChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Revenue',
                    data: [12000, 19000, 15000, 25000, 22000, 30000],
                    borderColor: '#6366f1',
                    backgroundColor: 'rgba(99,102,241,0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { labels: { color: '#f8fafc' } } },
                scales: {
                    x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
                    y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                }
            }
        });
    </script>
</body>

</html>
